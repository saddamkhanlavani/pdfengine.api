<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Deterministic generic-family resolution.

  Chromium does not use the engine's IFontResolver; it asks fontconfig which face to use
  for `sans-serif`, `serif` and `monospace`. If fontconfig answers differently on two
  hosts, the same HTML renders to different bytes, and the determinism gate that passes
  on a developer machine means nothing in production. Naming the face explicitly is what
  makes the container's output comparable to the gate's baseline.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <!-- Helvetica and Arial are requested constantly by real-world HTML and exist on no
       Linux host. Carlito is metric-compatible with Arial, so lines break where the
       author expected rather than where a fallback happened to land. -->
  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <!-- Deterministic subpixel/hinting, for the same reason. -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
