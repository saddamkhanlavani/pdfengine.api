services:
  # The engine itself. Built from the Dockerfile in this directory, which pins Chromium,
  # the fonts and qpdf — the three things that decide what the output bytes are.
  api:
    build: .
    image: pdfengine:local
    container_name: pdfengine-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Timeout=5 so an unreachable database is DISCOVERED in five seconds rather than
      # thirty. Measured by tests/chaos_gate.py: under a full network partition the
      # engine answered correctly (503) but took 30.2s to do it, which is a client
      # timeout for most callers and a pile-up of held connections for us.
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=pdfengine;Username=pdfuser;Password=pdfpassword;Timeout=5;Command Timeout=15"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      # Inside a container 127.0.0.1 is the container itself, so every default that
      # points at localhost has to be restated against a service name.
      AWS__ServiceURL: "http://minio:9000"
      AWS__AccessKey: "minioadmin"
      AWS__SecretKey: "minioadmin"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pdfengine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  minio:
    image: minio/minio
    container_name: pdfengine-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # This initializes the MinIO bucket automatically
  minio-init:
    image: minio/mc
    container_name: pdfengine-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/pdf-storage --ignore-existing; /usr/bin/mc anonymous set public myminio/pdf-storage; exit 0; "

  postgres:
    image: postgres:15-alpine
    container_name: pdfengine-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pdfuser
      POSTGRES_PASSWORD: pdfpassword
      POSTGRES_DB: pdfengine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # PHASE 10: Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: pdfengine-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # PHASE 10: Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: pdfengine-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
  # MailDev for Local SMTP Email testing
  maildev:
    image: maildev/maildev:2.1.0
    container_name: pdfengine-maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  postgres_data:
  grafana_data:
